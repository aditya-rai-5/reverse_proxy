port: 8080

# Application and redirect listener limits; changes require a restart.
server:
  read_header_timeout: 5s
  idle_timeout: 60s
  max_header_bytes: 1048576

# Management endpoints are available only to local connections by default.
management:
  address: "127.0.0.1:9091"
  allowed_cidrs: ["127.0.0.0/8", "::1/128"]

# Trust forwarding headers only from explicitly configured proxy CIDRs.
trusted_proxies: []

# Maximum request body buffered for upstream retries (10 MiB by default).
max_request_body_bytes: 10485760

# Global per-IP rate limiting (token bucket via golang.org/x/time/rate)
rate_limit:
  requests_per_minute: 60
  burst: 10

health_check:
  path: "/health"
  interval: 10s
  timeout: 5s

routes:
  # Weighted Round-Robin with Retries & Circuit Breaker
  - path: "/api"
    strip_prefix: "/api"
    algorithm: "weighted_round_robin"
    retries: 2
    # Defaults to read-only retries. Writes additionally require backend deduplication.
    retry_methods: [GET, HEAD, OPTIONS]
    timeout: 3s
    circuit_breaker:
      failure_threshold: 5 
      cooldown: 10s
    backends:
      - url: "http://localhost:9001"
        weight: 2
      - url: "http://localhost:9002"
        weight: 1

  # Least Connections: routes to backend with least in-flight requests (with route-level rate limit)
  - path: "/compute"
    algorithm: "least_conn"
    retries: 1
    timeout: 5s
    rate_limit:
      requests_per_minute: 30
      burst: 5
    backends:
      - url: "http://localhost:9003"
      - url: "http://localhost:9004"

  # Sticky Sessions: uses session cookie to keep subsequent requests on the same backend
  - path: "/app"
    algorithm: "sticky"
    cookie_name: "SERVERID"
    retries: 1
    backends:
      - url: "http://localhost:9005"
      - url: "http://localhost:9006"

  # IP Hash: hashes client IP to deterministically pin user requests
  - path: "/ip"
    algorithm: "ip_hash"
    retries: 1
    backends:
      - url: "http://localhost:9007"
      - url: "http://localhost:9008"

  # Fallback root route (defaults to round-robin)
  - path: "/"
    algorithm: "round_robin"
    backends:
      - url: "http://localhost:9000"
